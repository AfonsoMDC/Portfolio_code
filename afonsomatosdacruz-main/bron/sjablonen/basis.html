<!doctype html>
<html lang="{{taal}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{paginatitel}}</title>
<meta name="description" content="{{paginabeschrijving}}">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="{{canoniek}}">
{{hreflang}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Afonso Matos da Cruz">
<meta property="og:title" content="{{paginatitel}}">
<meta property="og:description" content="{{paginabeschrijving}}">
<meta property="og:url" content="{{canoniek}}">
<meta property="og:locale" content="{{landcode}}">
<meta property="og:image" content="{{domein}}/afbeeldingen/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
<link rel="manifest" href="/favicon/site.webmanifest">
<link rel="preload" href="/lettertypen/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/stijl.css">
{{gestructureerde_gegevens}}
</head>
<body>
<a class="sla-over" href="#inhoud">{{algemeen.sla_over}}</a>
<header class="kop raster">
<a class="merk" href="{{start_url}}">Afonso Matos da Cruz</a>
<nav class="menu" aria-label="{{algemeen.menu}}">{{menu}}</nav>
<nav class="taal" aria-label="{{algemeen.taal}}">{{taalkeuze}}</nav>
</header>
<main id="inhoud">
{{inhoud}}
</main>
<footer class="voet raster">
<p>{{voet.copyright}}</p>
<p>{{start.plaats}} <span class="klok"></span></p>
<ul class="voet-links">
<li><a href="mailto:{{email}}">{{email}}</a></li>
<li><a href="{{instagram}}" target="_blank" rel="noopener">Instagram</a></li>
<li><a href="{{privacy_url}}">{{voet.privacy}}</a></li>
</ul>
</footer>
{{vergroting}}
{{scripts}}
</body>
</html>
